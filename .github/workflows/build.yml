name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: brew install qt
      - name: Build
        run: |
          qmake6 CONFIG+=release
          make -j"$(sysctl -n hw.ncpu)" release
      - name: Package
        run: |
          APP=FreeSSM.app
          RES="$APP/Contents/Resources"
          mkdir -p "$RES"
          lrelease FreeSSM_en.ts FreeSSM_de.ts FreeSSM_tr.ts
          cp -R definitions doc "$RES/"
          cp FreeSSM_*.qm LiberationSans-*.ttf background.png "$RES/"
          macdeployqt "$APP"
          ditto -c -k --keepParent "$APP" FreeSSM-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FreeSSM-macos-arm64
          path: FreeSSM-macos-arm64.zip

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev-tools qt6-l10n-tools libgl1-mesa-dev
      - name: Build
        run: |
          qmake6 CONFIG+=release
          make -j"$(nproc)" release
      - name: Package
        run: |
          mkdir -p dist/FreeSSM
          /usr/lib/qt6/bin/lrelease FreeSSM_en.ts FreeSSM_de.ts FreeSSM_tr.ts
          cp FreeSSM FreeSSM_*.qm LiberationSans-*.ttf background.png README.txt LICENSE.txt dist/FreeSSM/
          cp -R definitions doc dist/FreeSSM/
          tar -C dist -czf FreeSSM-linux-x86_64.tar.gz FreeSSM
      - uses: actions/upload-artifact@v4
        with:
          name: FreeSSM-linux-x86_64
          path: FreeSSM-linux-x86_64.tar.gz

  windows:
    name: Windows (${{ matrix.label }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # 32-bit: needed for J2534 interfaces that only ship a 32-bit DLL (e.g. Tactrix OpenPort 2.0)
          - label: 32-bit
            qt: '5.15.2'
            arch: win32_mingw81
            tools: 'tools_mingw,qt.tools.win32_mingw810'
            mingw: mingw810_32
            qmake: qmake
            out: windows-x86
          - label: 64-bit
            qt: '6.8.3'
            arch: win64_mingw
            tools: 'tools_mingw1310'
            mingw: mingw1310_64
            qmake: qmake6
            out: windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt + MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: ${{ matrix.arch }}
          tools: ${{ matrix.tools }}
      - name: Build
        shell: cmd
        run: |
          set PATH=%IQTA_TOOLS%\${{ matrix.mingw }}\bin;%PATH%
          ${{ matrix.qmake }} CONFIG+=release
          mingw32-make -j4 release
          g++ -O2 -std=c++11 -static -Isrc -Isrc\windows tools\j2534list\main.cpp src\windows\J2534_API.cpp src\J2534misc.cpp -o j2534list.exe
      - name: Package
        shell: pwsh
        run: |
          $env:PATH = "$env:IQTA_TOOLS\${{ matrix.mingw }}\bin;$env:PATH"
          New-Item -ItemType Directory -Force dist\FreeSSM | Out-Null
          lrelease FreeSSM_en.ts FreeSSM_de.ts FreeSSM_tr.ts
          Copy-Item FreeSSM.exe, j2534list.exe, FreeSSM_*.qm, LiberationSans-*.ttf, background.png, README.txt, LICENSE.txt dist\FreeSSM\
          Copy-Item -Recurse definitions, doc dist\FreeSSM\
          if ("${{ matrix.qt }}".StartsWith("5.")) {
            # Qt 5 windeployqt can't find the platform plugin on CI, so deploy by hand
            $qtbin = "$env:QT_ROOT_DIR\bin"
            $plug = "$env:QT_ROOT_DIR\plugins"
            Copy-Item "$qtbin\Qt5Core.dll", "$qtbin\Qt5Gui.dll", "$qtbin\Qt5Widgets.dll", "$qtbin\Qt5PrintSupport.dll", "$qtbin\libgcc_s_dw2-1.dll", "$qtbin\libstdc++-6.dll", "$qtbin\libwinpthread-1.dll" dist\FreeSSM\
            foreach ($d in "platforms", "styles", "printsupport", "imageformats") {
              if (Test-Path "$plug\$d") { Copy-Item -Recurse "$plug\$d" "dist\FreeSSM\$d" }
            }
            Get-ChildItem -Recurse dist\FreeSSM -Filter *d.dll | Where-Object { Test-Path ($_.FullName -replace 'd\.dll$', '.dll') } | Remove-Item
          } else {
            windeployqt --release dist\FreeSSM\FreeSSM.exe
          }
          Compress-Archive -Path dist\FreeSSM -DestinationPath FreeSSM-${{ matrix.out }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FreeSSM-${{ matrix.out }}
          path: FreeSSM-${{ matrix.out }}.zip
